<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sword × Staff Screenshot Importer</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

}

}

}

}

}

}

}

<body>

<div class="container">

<h1>⚔️ Sword × Staff Guild Screenshot Importer</h1>

<div class="subtitle">
Experimental importer. Your existing roster will only be read for name matching.
Nothing will be changed.
</div>


<!-- ========================================================= -->
<!-- UPLOAD -->
<!-- ========================================================= -->

<div class="panel">

<label class="upload">

    <strong style="font-size:20px;">
        📸 Select Guild Screenshots
    </strong>

    <br><br>

    Select all screenshots covering your guild.

    <br>

    The importer automatically ignores the incomplete player
    at the bottom of each screenshot.

    <input
        id="files"
        type="file"
        accept="image/*"
        multiple
    >

</label>

<div id="fileList"></div>

<div class="button-row">

<button
    id="analyze"
    onclick="analyze()"
    disabled
>
    🔍 Analyze Screenshots
</button>

<button
    class="secondary"
    onclick="clearAll()"
>
    Clear
</button>

</div>

</div>


<!-- ========================================================= -->
<!-- STATUS -->
<!-- ========================================================= -->

<div class="panel">

<strong>Status</strong>

<div id="status" class="status">
Waiting for screenshots...
</div>

<div class="progress">
    <div
        id="progress"
        class="progress-bar"
    ></div>
</div>

</div>


<!-- ========================================================= -->
<!-- RESULTS -->
<!-- ========================================================= -->

<div
    id="resultsPanel"
    class="panel"
    style="display:none;"
>

<h2>Detected Players</h2>

<div id="summary"></div>

<br>

<table>

<thead>

<tr>
    <th>#</th>
    <th>Name</th>
    <th>Power</th>
    <th>Class</th>
    <th>Match</th>
</tr>

</thead>

<tbody id="results"></tbody>

</table>

<div class="button-row">

<button
    class="success"
    onclick="downloadJSON()"
>
    💾 Export JSON
</button>

<button
    class="secondary"
    onclick="copyJSON()"
>
    📋 Copy JSON
</button>

</div>

</div>

</div>


<script>

/* ================================================================
   CONFIGURATION
================================================================ */

const CONFIG = {

    /*
        Where the class badge is located horizontally.

        Based on your actual screenshots:

        screenshot width = 921

        badge is around x = 135-180
    */

    badgeX1: 110,
    badgeX2: 195,

    /*
        Don't look at the top/bottom UI.
    */

    scanY1: 260,
    scanY2: 1750,

    /*
        Minimum vertical distance between badge detections.

        Each player is roughly 130-150 pixels apart.
    */

    minimumRowDistance: 90,

    /*
        Name area.

        Your player names begin around x=160.
    */

    nameX1: 155,
    nameX2: 390,

    /*
        Power area.
    */

    powerX1: 190,
    powerX2: 350,

    /*
        Vertical offsets from the badge center.

        These are deliberately fairly generous.
    */

    nameY1: -35,
    nameY2: 15,

    powerY1: 10,
    powerY2: 65

};


/* ================================================================
   STATE
================================================================ */

let files = [];

let detectedPlayers = [];

let existingRoster = [];


/* ================================================================
   FILE INPUT
================================================================ */

document
.getElementById("files")
.addEventListener("change", function(event) {

    files = Array.from(event.target.files);

    displayFiles();

});


/* ================================================================
   DISPLAY FILES
================================================================ */

function displayFiles() {

    const container =
        document.getElementById("fileList");

    container.innerHTML = "";

    files.forEach(function(file, index) {

        const div =
            document.createElement("div");

        div.className = "file";

        div.textContent =
            `${index + 1}. ${file.name}`;

        container.appendChild(div);

    });


    document.getElementById("analyze").disabled =
        files.length === 0;

}


/* ================================================================
   LOAD EXISTING ROSTER
================================================================ */

async function loadRoster() {

    try {

        const response =
            await fetch("roster.json", {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "Could not load roster.json"
            );

        }

        const data =
            await response.json();

        existingRoster =
            Array.isArray(data.members)
                ? data.members
                : [];

        return true;

    }

    catch (error) {

        console.warn(
            "Existing roster could not be loaded:",
            error
        );

        existingRoster = [];

        return false;

    }

}


/* ================================================================
   MAIN ANALYSIS
================================================================ */

async function analyze() {

    if (!files.length) {
        return;
    }


    detectedPlayers = [];


    document.getElementById("analyze").disabled =
        true;


    document.getElementById("resultsPanel")
        .style.display = "none";


    setProgress(0);


    /*
        Load current roster.

        This is important because we can use existing player names
        to correct imperfect OCR.
    */

    setStatus(
        "Loading current roster..."
    );


    await loadRoster();


    setStatus(
        `Current roster: ${existingRoster.length} players\n\n` +
        `Starting OCR...`
    );


    /*
        Create one OCR worker.
    */

    const worker =
        await Tesseract.createWorker("eng");


    /*
        First we configure normal OCR.
    */

    await worker.setParameters({

        tessedit_pageseg_mode: "7"

    });


    /*
        Process every screenshot.
    */

    for (
        let screenshotIndex = 0;
        screenshotIndex < files.length;
        screenshotIndex++
    ) {

        const file =
            files[screenshotIndex];


        setStatus(
            `Analyzing screenshot ${screenshotIndex + 1} of ${files.length}\n` +
            `${file.name}\n\n` +
            `Finding player rows...`
        );


        const image =
            await loadImage(file);


        /*
            Detect colored class badges.

            This gives us the Y position of every player.
        */

        const rowCenters =
            detectPlayerRows(image);


        setStatus(
            `Analyzing screenshot ${screenshotIndex + 1} of ${files.length}\n` +
            `${file.name}\n\n` +
            `Found ${rowCenters.length} possible player rows.`
        );


        /*
            We expect 10 complete players.

            If we find more, use the first 10 valid rows.
        */

        const rows =
            rowCenters.slice(0, 10);


        for (
            let rowIndex = 0;
            rowIndex < rows.length;
            rowIndex++
        ) {

            const y =
                rows[rowIndex];


            const player =
                await processRow(
                    image,
                    y,
                    worker,
                    screenshotIndex,
                    rowIndex
                );


            if (player) {

                detectedPlayers.push(player);

            }


            const completed =
                screenshotIndex * 10
                + rowIndex
                + 1;


            const total =
                files.length * 10;


            setProgress(
                completed / total * 100
            );

        }

    }


    await worker.terminate();


    /*
        Remove duplicates.

        This is useful if screenshots overlap.
    */

    detectedPlayers =
        deduplicatePlayers(
            detectedPlayers
        );


    /*
        Try matching OCR names against existing roster.
    */

    detectedPlayers =
        matchExistingPlayers(
            detectedPlayers
        );


    displayResults();


    setStatus(
        `Finished!\n\n` +
        `Detected ${detectedPlayers.length} unique players.`
    );


    document.getElementById("analyze").disabled =
        false;

}


/* ================================================================
   DETECT PLAYER ROWS
================================================================ */

function detectPlayerRows(image) {

    const canvas =
        document.createElement("canvas");

    canvas.width =
        image.width;

    canvas.height =
        image.height;


    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        image,
        0,
        0
    );


    const imageData =
        ctx.getImageData(
            CONFIG.badgeX1,
            CONFIG.scanY1,
            CONFIG.badgeX2 - CONFIG.badgeX1,
            CONFIG.scanY2 - CONFIG.scanY1
        );


    const data =
        imageData.data;


    /*
        Count saturated/colorful pixels at every Y.

        The class badges are much more saturated than the
        gray avatar borders.
    */

    const counts =
        new Array(
            CONFIG.scanY2 - CONFIG.scanY1
        ).fill(0);


    for (
        let y = 0;
        y < imageData.height;
        y++
    ) {

        for (
            let x = 0;
            x < imageData.width;
            x++
        ) {

            const index =
                (y * imageData.width + x) * 4;


            const r =
                data[index];

            const g =
                data[index + 1];

            const b =
                data[index + 2];


            const max =
                Math.max(r, g, b);

            const min =
                Math.min(r, g, b);


            /*
                Saturation approximation.
            */

            if (
                max - min > 60 &&
                max > 100
            ) {

                counts[y]++;

            }

        }

    }


    /*
        Find peaks.

        We don't need an external library.
    */

    const peaks = [];


    for (
        let y = 3;
        y < counts.length - 3;
        y++
    ) {

        const value =
            counts[y];


        if (
            value < 5
        ) {

            continue;

        }


        if (
            value >= counts[y - 1] &&
            value >= counts[y + 1] &&
            value >= counts[y - 2] &&
            value >= counts[y + 2]
        ) {

            peaks.push({
                y:
                    y + CONFIG.scanY1,

                strength:
                    value
            });

        }

    }


    /*
        Merge peaks that are close together.

        A single badge can create several nearby peaks.
    */

    const merged = [];


    for (
        const peak of peaks
    ) {

        const last =
            merged[merged.length - 1];


        if (
            last &&
            peak.y - last.y <
            CONFIG.minimumRowDistance
        ) {

            /*
                Keep stronger peak.
            */

            if (
                peak.strength >
                last.strength
            ) {

                merged[
                    merged.length - 1
                ] = peak;

            }

        }

        else {

            merged.push(peak);

        }

    }


    return merged.map(
        item => item.y
    );

}


/* ================================================================
   PROCESS PLAYER ROW
================================================================ */

async function processRow(
    image,
    badgeY,
    worker,
    screenshotIndex,
    rowIndex
) {


    /*
        Class comes from the badge color.
    */

    const className =
        detectClass(
            image,
            badgeY
        );


    /*
        OCR NAME
    */

    const nameCanvas =
        crop(
            image,

            CONFIG.nameX1,

            badgeY + CONFIG.nameY1,

            CONFIG.nameX2,

            badgeY + CONFIG.nameY2
        );


    /*
        Upscale.

        This helps Tesseract considerably.
    */

    const enlargedName =
        upscale(
            nameCanvas,
            4
        );


    const nameResult =
        await worker.recognize(
            enlargedName
        );


    let name =
        cleanName(
            nameResult.data.text
        );


    /*
        OCR POWER
    */

    const powerCanvas =
        crop(
            image,

            CONFIG.powerX1,

            badgeY + CONFIG.powerY1,

            CONFIG.powerX2,

            badgeY + CONFIG.powerY2
        );


    const enlargedPower =
        upscale(
            powerCanvas,
            5
        );


    /*
        Power OCR uses a restricted character set.
    */

    await worker.setParameters({

        tessedit_char_whitelist:
            "0123456789.MKmk",

        tessedit_pageseg_mode:
            "7"

    });


    const powerResult =
        await worker.recognize(
            enlargedPower
        );


    const powerText =
        powerResult.data.text;


    const power =
        parsePower(
            powerText
        );


    /*
        Restore normal OCR settings for names.
    */

    await worker.setParameters({

        tessedit_char_whitelist:
            "",

        tessedit_pageseg_mode:
            "7"

    });


    /*
        Ignore a completely empty row.
    */

    if (
        !name &&
        !power
    ) {

        return null;

    }


    return {

        id:
            crypto.randomUUID(),

        name:
            name || "UNKNOWN",

        class:
            className || "Unknown",

        power:
            power,

        notes:
            "",

        screenshot:
            screenshotIndex,

        row:
            rowIndex,

        badgeY:
            badgeY,

        originalOCRName:
            name,

        originalOCRPower:
            powerText,

        match:
            null

    };

}


/* ================================================================
   CLASS DETECTION
================================================================ */

function detectClass(
    image,
    centerY
) {

    const canvas =
        crop(
            image,

            120,

            centerY - 30,

            195,

            centerY + 30
        );


    const ctx =
        canvas.getContext("2d");


    const data =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        ).data;


    let red = 0;
    let green = 0;
    let blue = 0;
    let orange = 0;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        /*
            RED
        */

        if (
            r > 120 &&
            r > g * 1.35 &&
            r > b * 1.35
        ) {

            red++;

        }


        /*
            GREEN
        */

        if (
            g > 90 &&
            g > r * 1.20 &&
            g > b * 1.05
        ) {

            green++;

        }


        /*
            BLUE
        */

        if (
            b > 100 &&
            b > r * 1.20 &&
            b > g * 1.05
        ) {

            blue++;

        }


        /*
            ORANGE
        */

        if (
            r > 130 &&
            g > 60 &&
            r > b * 1.50 &&
            g > b * 1.15
        ) {

            orange++;

        }

    }


    const values = [

        {
            name: "Berserker",
            value: red
        },

        {
            name: "Arcanist",
            value: green
        },

        {
            name: "Paladin",
            value: orange
        },

        {
            name: "Archmage",
            value: blue
        }

    ];


    values.sort(
        (a, b) =>
            b.value - a.value
    );


    /*
        Require some actual color.
    */

    if (
        values[0].value < 5
    ) {

        return "Unknown";

    }


    return values[0].name;

}


/* ================================================================
   IMAGE CROP
================================================================ */

function crop(
    image,
    x1,
    y1,
    x2,
    y2
) {

    x1 =
        Math.max(
            0,
            Math.round(x1)
        );

    y1 =
        Math.max(
            0,
            Math.round(y1)
        );

    x2 =
        Math.min(
            image.width,
            Math.round(x2)
        );

    y2 =
        Math.min(
            image.height,
            Math.round(y2)
        );


    const canvas =
        document.createElement("canvas");


    canvas.width =
        x2 - x1;

    canvas.height =
        y2 - y1;


    canvas
        .getContext("2d")
        .drawImage(

            image,

            x1,
            y1,

            canvas.width,
            canvas.height,

            0,
            0,

            canvas.width,
            canvas.height

        );


    return canvas;

}


/* ================================================================
   UPSCALE
================================================================ */

function upscale(
    canvas,
    factor
) {

    const result =
        document.createElement("canvas");


    result.width =
        canvas.width * factor;

    result.height =
        canvas.height * factor;


    const ctx =
        result.getContext("2d");


    ctx.imageSmoothingEnabled =
        true;


    ctx.drawImage(
        canvas,

        0,
        0,

        result.width,
        result.height
    );


    return result;

}


/* ================================================================
   LOAD IMAGE
================================================================ */

function loadImage(file) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                            resolve(img);

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* ================================================================
   CLEAN NAME
================================================================ */

function cleanName(text) {

    if (!text) {
        return "";
    }


    let name =
        text
            .replace(/\n/g, " ")
            .replace(/[|[\]{}]/g, "")
            .trim();


    /*
        Remove obvious OCR junk around the edges.
    */

    name =
        name
            .replace(
                /^[^A-Za-z0-9^?_.-]+/,
                ""
            )
            .replace(
                /[^A-Za-z0-9^?_.-]+$/,
                ""
            )
            .trim();


    /*
        If OCR accidentally captured the power,
        remove it.
    */

    name =
        name.replace(
            /\s+\d+(?:[.,]\d+)?\s*[MKmk]\s*$/,
            ""
        ).trim();


    return name;

}


/* ================================================================
   PARSE POWER
================================================================ */

function parsePower(text) {

    if (!text) {
        return 0;
    }


    let value =
        text
            .replace(/\s/g, "")
            .replace(/,/g, ".")
            .trim();


    /*
        Search specifically for a number followed by
        M or K.

        This avoids accidentally reading the weapon icon
        as a number.
    */

    let match =
        value.match(
            /(\d+(?:\.\d+)?)([MKmk])/
        );


    if (match) {

        let number =
            parseFloat(match[1]);


        const suffix =
            match[2].toUpperCase();


        if (
            suffix === "M"
        ) {

            number *= 1000000;

        }

        else if (
            suffix === "K"
        ) {

            number *= 1000;

        }


        return Math.round(
            number
        );

    }


    /*
        Fallback for plain numbers.
    */

    match =
        value.match(
            /\d+(?:\.\d+)?/
        );


    if (!match) {

        return 0;

    }


    return Math.round(
        parseFloat(match[0])
    );

}


/* ================================================================
   DEDUPLICATE
================================================================ */

function deduplicatePlayers(
    players
) {

    const unique = [];


    for (
        const player of players
    ) {

        if (
            !player.name ||
            player.name === "UNKNOWN"
        ) {

            continue;

        }


        const existing =
            unique.find(
                p =>
                    normalizeName(
                        p.name
                    ) ===
                    normalizeName(
                        player.name
                    )
            );


        if (!existing) {

            unique.push(player);

            continue;

        }


        /*
            Prefer the record with more information.
        */

        if (
            !existing.power &&
            player.power
        ) {

            existing.power =
                player.power;

        }


        if (
            existing.class === "Unknown" &&
            player.class !== "Unknown"
        ) {

            existing.class =
                player.class;

        }

    }


    return unique;

}


/* ================================================================
   MATCH OCR AGAINST EXISTING ROSTER
================================================================ */

function matchExistingPlayers(
    players
) {

    for (
        const player of players
    ) {

        const result =
            findBestRosterMatch(
                player.name
            );


        if (
            result
        ) {

            player.match =
                result.member;


            /*
                IMPORTANT:

                If we have a strong existing-name match,
                use the real roster name instead of the
                imperfect OCR name.
            */

            player.name =
                result.member.name;

            player.matchScore =
                result.score;

        }

    }


    return players;

}


/* ================================================================
   FIND BEST MATCH
================================================================ */

function findBestRosterMatch(
    ocrName
) {

    if (
        !ocrName ||
        !existingRoster.length
    ) {

        return null;

    }


    const target =
        normalizeName(
            ocrName
        );


    if (!target) {
        return null;
    }


    let best =
        null;


    for (
        const member of existingRoster
    ) {

        const candidate =
            normalizeName(
                member.name
            );


        if (!candidate) {
            continue;
        }


        let score =
            similarity(
                target,
                candidate
            );


        /*
            Exact match.
        */

        if (
            target === candidate
        ) {

            score = 1;

        }


        /*
            One contains the other.

            Useful for OCR such as:

            "BrotherBadger."

            vs

            "BrotherBadger"
        */

        if (
            target.includes(candidate) ||
            candidate.includes(target)
        ) {

            score =
                Math.max(
                    score,
                    0.88
                );

        }


        if (
            !best ||
            score > best.score
        ) {

            best = {

                member:
                    member,

                score:
                    score

            };

        }

    }


    /*
        Don't accept weak matches.

        0.72 is deliberately conservative.
    */

    if (
        best &&
        best.score >= 0.72
    ) {

        return best;

    }


    return null;

}


/* ================================================================
   NORMALIZE NAME
================================================================ */

function normalizeName(
    name
) {

    return String(name)
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );

}


/* ================================================================
   STRING SIMILARITY
================================================================ */

function similarity(
    a,
    b
) {

    if (
        a === b
    ) {

        return 1;

    }


    if (
        !a ||
        !b
    ) {

        return 0;

    }


    /*
        Levenshtein distance.
    */

    const matrix =
        [];


    for (
        let i = 0;
        i <= b.length;
        i++
    ) {

        matrix[i] = [i];

    }


    for (
        let j = 0;
        j <= a.length;
        j++
    ) {

        matrix[0][j] = j;

    }


    for (
        let i = 1;
        i <= b.length;
        i++
    ) {

        for (
            let j = 1;
            j <= a.length;
            j++
        ) {

            if (
                b.charAt(i - 1) ===
                a.charAt(j - 1)
            ) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            }

            else {

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1][j] + 1,

                        matrix[i][j - 1] + 1,

                        matrix[i - 1][j - 1] + 1

                    );

            }

        }

    }


    const distance =
        matrix[b.length][a.length];


    const maxLength =
        Math.max(
            a.length,
            b.length
        );


    return 1 -
        distance / maxLength;

}


/* ================================================================
   DISPLAY RESULTS
================================================================ */

function displayResults() {

    const panel =
        document.getElementById(
            "resultsPanel"
        );


    const body =
        document.getElementById(
            "results"
        );


    body.innerHTML = "";


    let matched = 0;
    let unmatched = 0;


    detectedPlayers.forEach(
        function(player, index) {

            if (
                player.match
            ) {

                matched++;

            }

            else {

                unmatched++;

            }


            const tr =
                document.createElement(
                    "tr"
                );


            const className =
                player.class
                    .toLowerCase();


            let matchHTML;


            if (
                player.match
            ) {

                matchHTML =

                    `<span class="match">
                        ✓ ${Math.round(player.matchScore * 100)}%
                    </span>`;

            }

            else {

                matchHTML =

                    `<span class="new-player">
                        ⚠ New / unmatched
                    </span>`;

            }


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>

                    <strong>
                        ${escapeHTML(
                            player.name
                        )}
                    </strong>

                    ${
                        player.originalOCRName &&
                        player.originalOCRName !== player.name

                        ? `<br>
                           <span class="small">
                               OCR: ${escapeHTML(
                                   player.originalOCRName
                               )}
                           </span>`

                        : ""
                    }

                </td>

                <td>

                    ${
                        player.power

                        ? player.power.toLocaleString()

                        : `<span class="bad">
                            UNKNOWN
                           </span>`
                    }

                    ${
                        player.originalOCRPower

                        ? `<br>
                           <span class="small">
                               OCR: ${escapeHTML(
                                   player.originalOCRPower
                               )}
                           </span>`

                        : ""
                    }

                </td>

                <td>

                    <span
                        class="badge ${
                            [
                                "berserker",
                                "arcanist",
                                "paladin",
                                "archmage"
                            ].includes(className)
                            ? className
                            : "unknown"
                        }"
                    >
                        ${escapeHTML(
                            player.class
                        )}
                    </span>

                </td>

                <td>
                    ${matchHTML}
                </td>

            `;


            body.appendChild(tr);

        }
    );


    document.getElementById(
        "summary"
    ).innerHTML = `

        <strong>
            ${detectedPlayers.length}
            players detected
        </strong>

        <br><br>

        <span class="good">
            ✓ ${matched} matched existing roster
        </span>

        &nbsp;&nbsp;&nbsp;

        <span class="warn">
            ⚠ ${unmatched} unmatched
        </span>

    `;


    panel.style.display =
        "block";

}


/* ================================================================
   EXPORT JSON
================================================================ */

function createJSON() {

    return {

        format:
            "sword-x-staff-guild-planner",

        version:
            4,

        exportedAt:
            new Date().toISOString(),

        members:
            detectedPlayers.map(
                function(player) {

                    return {

                        id:
                            player.match
                            ? player.match.id
                            : player.id,

                        name:
                            player.name,

                        class:
                            player.class,

                        power:
                            player.power,

                        notes:
                            player.match
                            ? player.match.notes || ""
                            : ""

                    };

                }
            ),

        teams: []

    };

}


function downloadJSON() {

    const json =
        createJSON();


    const blob =
        new Blob(

            [
                JSON.stringify(
                    json,
                    null,
                    2
                )
            ],

            {
                type:
                    "application/json"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        "roster-screenshot-import.json";


    a.click();


    URL.revokeObjectURL(
        url
    );

}


async function copyJSON() {

    await navigator.clipboard.writeText(

        JSON.stringify(
            createJSON(),
            null,
            2
        )

    );


    alert(
        "Roster JSON copied."
    );

}


/* ================================================================
   HTML ESCAPE
================================================================ */

function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================================================================
   UI
================================================================ */

function setStatus(
    text
) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


function setProgress(
    value
) {

    document.getElementById(
        "progress"
    ).style.width =
        `${Math.min(100, value)}%`;

}


function clearAll() {

    files = [];

    detectedPlayers = [];

    document.getElementById(
        "files"
    ).value = "";

    document.getElementById(
        "fileList"
    ).innerHTML = "";

    document.getElementById(
        "resultsPanel"
    ).style.display =
        "none";

    document.getElementById(
        "analyze"
    ).disabled =
        true;

    setProgress(0);

    setStatus(
        "Waiting for screenshots..."
    );

}
